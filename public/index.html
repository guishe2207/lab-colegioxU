<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muro de ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Muro de ideas</h1>
<p>Press start · Comparte una idea con el curso</p>
</header>
<main>
<section id="formulario">
<h2>Comentarios sobre el juego </h2>
<form id="form-idea">
<input type="text" id="autor" placeholder="Tu apodo" maxlength="20" required>
<textarea id="texto" placeholder="Escribe tu idea (máx. 140 caracteres)" maxlength="140" required>
</textarea>
<button type="submit">▶ Publicar</button>
</form>
<p id="mensaje"></p>
</section>
<section id="muro">
<h2>Ranking de ideas</h2>
<div id="lista"></div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
